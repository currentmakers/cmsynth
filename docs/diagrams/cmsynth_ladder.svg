<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<title>cmsynth ladder filter</title>
<defs><marker id="a_audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="a_ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27a12"/></marker><marker id="a_hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="a_ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="28" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a202c" >Ladder filter: zero delay feedback, four one-pole stages</text>
<text x="40" y="125" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#4a5568" >mixer</text>
<circle cx="105" cy="120" r="17" fill="#fdf0dc" stroke="#c27a12" stroke-width="2"/>
<text x="105" y="126" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a202c" >+</text>
<polyline points="65,120 88,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<text x="118" y="158" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a202c" >−</text>
<rect x="150" y="88" width="125" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="212.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >× 1/(1+kG⁴)</text>
<text x="212.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >solves the loop</text>
<polyline points="122,120 150,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<rect x="310" y="88" width="115" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="367.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >soft clip</text>
<text x="367.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >x − 4x³/27</text>
<polyline points="275,120 310,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<rect x="460" y="88" width="95" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="507.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >stage 1</text>
<text x="507.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >1-pole, G</text>
<polyline points="425,120 460,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<rect x="580" y="88" width="95" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="627.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >stage 2</text>
<text x="627.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >1-pole, G</text>
<polyline points="555,120 580,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<rect x="700" y="88" width="95" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="747.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >stage 3</text>
<text x="747.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >1-pole, G</text>
<polyline points="675,120 700,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<rect x="820" y="88" width="95" height="64" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="867.5" y="116.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c" >stage 4</text>
<text x="867.5" y="134.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >1-pole, G</text>
<polyline points="795,120 820,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<polyline points="915,120 985,120" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<text x="950" y="110" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >to VCA</text>
<polyline points="960,120 960,225 585,225" fill="none" stroke="#2b6cb0" stroke-width="2"/>
<rect x="505" y="203" width="80" height="44" rx="8" fill="#e3effb" stroke="#2b6cb0" stroke-width="2"/>
<text x="545.0" y="230.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a202c" >× k</text>
<polyline points="505,225 105,225 105,137" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a_audio)"/>
<text x="300" y="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >feedback k = emphasis × 4.15 (self-oscillates at 4)</text>
<text x="740" y="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#4a5568" >S: the output's part that depends only on the stage states</text>
<rect x="40" y="290" width="440" height="150" rx="8" fill="#ffffff" stroke="#888888" stroke-width="2"/>
<text x="260" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a202c" >One stage (trapezoidal one-pole)</text>
<text x="80" y="350" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >v = (x − s) · G</text>
<text x="80" y="374" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >y = v + s</text>
<text x="80" y="398" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >s = y + v        (new state)</text>
<text x="80" y="424" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4a5568" >each stage: y = G·x + (1−G)·s</text>
<rect x="520" y="290" width="440" height="150" rx="8" fill="#ffffff" stroke="#888888" stroke-width="2"/>
<text x="740" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a202c" >Coefficient, at control rate</text>
<text x="560" y="350" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >g = tan(π · fc / fs)</text>
<text x="560" y="374" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >G = g / (1 + g)</text>
<text x="560" y="398" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#1a202c" >G interpolated per sample</text>
<text x="560" y="424" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4a5568" >tan() is a Padé approximation, no libm</text>
</svg>
